<div id="Stopwatch" class="time-tool">
    <h2>Stopwatch</h2>
    <div class="stopwatch">
        <div class="display-stopwatch">00:00:00</div>
        <div class="controls">
            <button class="startBtn-stopwatch">START</button>
            <button class="stopBtn-stopwatch">STOP</button>
            <button class="resetBtn-stopwatch">RESET</button>

        </div>
    </div>
</div>
